# Ollama token-auth proxy.
# Tokens live in KDE Wallet (folder "ollama-auth") and are materialised into
# /etc/nginx/tokens/maps.conf by ollama-tokens-sync.py (tmpfs, 0600, RAM only).
# Do not put tokens in this file.
# tokens are ~48-200 chars, default 64-byte buckets are too small for map keys
map_hash_bucket_size 256;

# Diagnostics only: what kind of Authorization header arrived (never the value itself).
map $http_authorization $om_auth_kind {
    default "none";
    "~^Bearer" "bearer";
    "~." "other";
}
map $http_x_api_key $om_xkey_kind {
    default "none";
    "~." "present";
}

include /etc/nginx/tokens/maps.conf;

log_format om_auth '$remote_addr [$time_local] dev=$om_dev auth=$om_auth_kind xkey=$om_xkey_kind "$request" $status $body_bytes_sent';

server {
    listen 11435;
    client_max_body_size 100m;
    access_log /dev/stdout om_auth;

    location / {
        set $om_dev $om_dev_bearer;
        if ($om_dev = "") { set $om_dev $om_dev_key; }
        if ($om_dev = "") { return 401; }

        proxy_pass http://host.containers.internal:11434;
        proxy_http_version 1.1;
        # Ollama 0.40 rejects requests with non-local Host (DNS-rebinding guard),
        # so do not forward the client's Host — pin it to loopback.
        proxy_set_header Host 127.0.0.1:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Ollama-Device $om_dev;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
