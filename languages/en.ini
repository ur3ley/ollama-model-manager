[editor]
title = Model editor
modelGroup = Model
from = FROM:
fromTip = Base model that all parameters are inherited from.\nPick an installed model or type a name manually\n(e.g. a model from the Ollama registry).
name = Model name:
namePlaceholder = e.g. my-model:variant
nameTip = Model name. For an installed model, changing it renames the model.
renderer = Renderer:
parser = Parser:
directivePlaceholder = empty — inherited
rendererTip = RENDERER selects how messages are turned into a prompt (Ollama 0.12+).\nIt overrides the model's embedded TEMPLATE without copying it.\nNamed after the family (e.g. qwen3.5); an unknown name is accepted silently.
parserTip = PARSER selects how the model output is parsed (tool calls, reasoning).\nNamed after the family; an unknown name is accepted silently.
capabilities = Capabilities: %1
capsTip = Taken from "ollama show". "thinking" means the model accepts the think\nparameter: for non-thinking models the /think marker from the template\nmay end up in the answer.
loadingQuants = Loading quants of %1...
quantsLoaded = Quants in the repository: %1
quantsInstalled = Installed quants: %1
quantsFailed = Could not load quants: %1
quantPulling = Downloading quant %1...
quantQueued = Quant %1 is queued: another download runs first...
quantInstalled = Quant installed: %1
quantInstalledMark = installed
quantFailed = Could not download the quant: %1
removeQuant = Remove quant
removeQuantTitle = Remove quant
removeQuantConfirm = Remove the model "%1"? It will disappear from the list and free up disk space.
installQuant = Install
installQuantTip = This quant is not installed yet — the button downloads it first.
quantNotInstalled = This quant is not installed. Press "Install" to download it.
advanced = Advanced
advancedTip = Show the technical fields: the RENDERER and PARSER directives.
Usually you do not need to change them.
infoTip = Model internals: what it was built from and which renderer/parser it uses.
modelInfoBase = Base: %1
modelInfoDirectives = renderer %1 · parser %2
memoryAvailable = ~%1 GB free
renameHint = Edit the name and press "Update model" to rename
templateSoftSwitch = This model carries a template with the /think soft switch.\nOllama will append the marker to the user message and a model without\nreasoning may echo it into its answer.\nThe template comes from the base model: check its card or set RENDERER/PARSER.
ctxGroup = Context
numCtx = num_ctx:
numCtxTip = Context window size in thousands of tokens (K = 1024).\nDefines how many previous tokens the model\n"sees" when generating a response.\nMore = longer dialogue, but more memory.\nTypical values: 4K, 8K, 32K, 128K.
sliderTip = Quick context size adjustment (K)
spinTip = Context window size in K (1K = 1024 tokens)
kUnit = K
sampleGroup = Sampling
temp = temperature:
tempTip = Temperature — controls the randomness of responses.\n0.0 = strictly deterministic (good for code/facts).\n0.5-0.7 = balanced creativity.\n1.0+ = high randomness, creative answers.\nAbove 1.5 = may produce incoherent text.
topP = top_p:
topPTip = top_p (nucleus sampling) — cumulative probability threshold.\nThe model picks from tokens whose total probability <= top_p.\n0.9 = consider tokens making up 90% of probability.\nLower = more predictable. 1.0 = no limit.
topK = top_k:
topKTip = top_k — limits the choice to the K most likely tokens.\n40 = the model picks only from the 40 most likely tokens.\nLower = more conservative answers.\nHigher = more variety.
repeatPenalty = repeat_penalty:
repeatPenaltyTip = repeat_penalty — penalty for repeating tokens.\n1.0 = no penalty. > 1.0 = lowers the probability\nof already used tokens. Helps avoid\nloops and repetition in answers.
repeatLastN = repeat_last_n:
repeatLastNTip = repeat_last_n — how many tokens back to look\nwhen checking for repetition (for repeat_penalty).\n64 = check the last 64 tokens.\n0 = look at the whole history.
penaltyGroup = Penalties
presencePenalty = presence_penalty:
presencePenaltyTip = presence_penalty — penalty for tokens already seen.\nPositive value = the model repeats itself less,\nencouraging new topics.\nNegative = the model returns more often\nto already mentioned topics (more coherence).
frequencyPenalty = frequency_penalty:
frequencyPenaltyTip = frequency_penalty — penalty proportional\nto the token frequency in the text. Pushes harder on frequent\nwords than presence_penalty.\nPositive = fewer word repetitions.\nNegative = more repetitions.
