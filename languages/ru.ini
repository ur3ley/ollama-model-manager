nameTip = Имя модели. Для установленной модели изменение имени = переименование.
renderer = Рендерер:
parser = Парсер:
directivePlaceholder = пусто — из модели
rendererTip = RENDERER задаёт, как сообщения превращаются в промпт (Ollama 0.12+).\nПозволяет переопределить вшитый в модель TEMPLATE, не копируя его.\nИмя — по семейству (напр. qwen3.5); неизвестное имя Ollama принимает молча.
parserTip = PARSER задаёт разбор ответа модели (вызовы инструментов, рассуждения).\nИмя — по семейству; неизвестное имя Ollama принимает молча.
capabilities = Возможности: %1
capsTip = Список из «ollama show». «thinking» у Ollama означает, что модель принимает\nпараметр think: у non-thinking моделей маркер /think из шаблона может\nпопасть в ответ.
loadingQuants = Загрузка квантов %1...
quantsLoaded = Квантов в репозитории: %1
quantsFailed = Не удалось получить кванты: %1
quantPulling = Скачивание кванта %1...
