[editor]
title = Редактор модели
modelGroup = Модель
from = FROM:
fromTip = Базовая модель, от которой наследуются все параметры.\nВыберите из списка установленных или введите имя вручную\n(например, для модели из реестра Ollama).
name = Имя:
namePlaceholder = напр. my-model:variant
nameTip = Имя новой модели
ctxGroup = Контекст
numCtx = num_ctx:
numCtxTip = Размер окна контекста в тысячах токенов (K = 1024).\nОпределяет, сколько предыдущих токенов\nмодель «видит» при генерации ответа.\nБольше = длиннее диалог, но больше памяти.\nТипичные значения: 4K, 8K, 32K, 128K.
sliderTip = Быстрая настройка размера контекста (K)
spinTip = Размер окна контекста в K (1K = 1024 токена)
kUnit = K
sampleGroup = Семплирование
temp = temperature:
tempTip = Температура (temperature) — управляет случайностью ответов.\n0.0 = строго детерминированные ответы (хорошо для кода/фактов).\n0.5–0.7 = сбалансированная креативность.\n1.0+ = высокая случайность, творческие ответы.\nВыше 1.5 = может генерировать бессвязный текст.
topP = top_p:
topPTip = top_p (nucleus sampling) — порог накопленной вероятности.\nМодель выбирает из токенов, чья суммарная вероятность ≤ top_p.\n0.9 = рассматриваются токены, дающие 90% вероятности.\nНиже = более предсказуемо. 1.0 = без ограничения.
topK = top_k:
topKTip = top_k — ограничивает выбор K наиболее вероятными токенами.\n40 = модель выбирает только из 40 самых вероятных токенов.\nНиже = более консервативные ответы.\nВыше = больше разнообразия.
repeatPenalty = repeat_penalty:
repeatPenaltyTip = repeat_penalty — штраф за повторение токенов.\n1.0 = без штрафа. > 1.0 = снижает вероятность\nуже использованных токенов. Помогает избежать\nзацикливания и повторений в ответах.
repeatLastN = repeat_last_n:
repeatLastNTip = repeat_last_n — на сколько токенов назад смотреть\nпри проверке повторений (для repeat_penalty).\n64 = проверять последние 64 токена.\n0 = смотреть на всю историю.
penaltyGroup = Штрафы
presencePenalty = presence_penalty:
presencePenaltyTip = presence_penalty — штраф за уже встречавшиеся токены.\nПоложительное значение = модель реже повторяет\nуже сказанное, побуждая к новым темам.\nОтрицательное = модель чаще возвращается\nк уже упомянутым темам (больше связности).
frequencyPenalty = frequency_penalty:
frequencyPenaltyTip = frequency_penalty — штраф, пропорциональный\nчастоте токена в тексте. Сильнее давит на частые\nслова, чем presence_penalty.\nПоложительное = меньше повторений слов.\nОтрицательное = больше повторений.
sysGroup = Системный промпт
